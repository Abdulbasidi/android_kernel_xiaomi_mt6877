name: Build ruby kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves cpio kmod rsync \
            zip unzip xz-utils zstd device-tree-compiler python3 curl ca-certificates

      - name: Download clang r510928
        run: |
          mkdir -p "$RUNNER_TEMP/clang"
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r510928.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/clang"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Build Image
        run: |
          export PATH="$RUNNER_TEMP/clang/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LOCALVERSION=-RubyX ruby_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LOCALVERSION=-RubyX Image
          ls -lh out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/README.md
          cp out/arch/arm64/boot/Image ak3/Image
          echo '' | base64 -d > ak3/anykernel.sh
          cd ak3
          zip -r9 "../AnyKernel3-ruby-6.6.143-${GITHUB_RUN_NUMBER}.zip" . -x ".git/*"
          cd ..
          sha256sum AnyKernel3-ruby-6.6.143-*.zip | tee sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ruby-6.6.143-build${{ github.run_number }}
          path: |
            AnyKernel3-ruby-6.6.143-*.zip
            sha256.txt

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ruby 6.6.143 build ${{ github.run_number }}
          body: |
            Kernel: 6.6.143 + LOCALVERSION=-RubyX
            Tree: RubyXLabs/android_kernel_xiaomi_mt6877 (lineage-24.0), ruby_defconfig
            Toolchain: AOSP clang r510928

            AnyKernel3 zip, kernel-only swap inside boot.img (ramdisk untouched).
            Flash from a custom recovery or from a kernel flasher app.
            Back up the current boot partition before flashing.
          files: |
            AnyKernel3-ruby-6.6.143-${{ github.run_number }}.zip
            sha256.txt
